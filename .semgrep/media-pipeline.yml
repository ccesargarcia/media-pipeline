rules:
  - id: media-pipeline-no-eval-or-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: Evite eval() ou exec() em Python por risco de execução arbitrária de código (RCE).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-95"

  - id: media-pipeline-no-subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
    message: Uso de subprocess com shell=True detectado; passe a lista de argumentos sem shell=True para evitar Command Injection.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-78"

  - id: media-pipeline-no-hardcoded-provider-secrets
    pattern-regex: "(AIza[0-9A-Za-z_-]{35}|gsk_[0-9A-Za-z]{40,}|sk-or-v1-[0-9a-fA-F]{48,}|gh[po]_[0-9A-Za-z]{36}|tskey-[a-z]+-[0-9A-Za-z_-]{16,}|hf_[0-9A-Za-z]{30,})"
    message: Possível chave ou token de API hardcoded detectado no código-fonte. Utilize variáveis de ambiente ou GitHub Secrets.
    languages: [generic]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"

  - id: media-pipeline-no-hardcoded-ftp-password
    pattern-either:
      - pattern: $FTP.login($USER, "...")
      - pattern: FTP_PASS = "..."
      - pattern: FTP_PASSWORD = "..."
    message: Evite senhas de FTP hardcoded no código-fonte. Leia via os.environ (FTP_PASSWORD).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"

  - id: media-pipeline-no-secret-print
    patterns:
      - pattern-either:
          - pattern: print(..., $SECRET, ...)
          - pattern: logging.info(..., $SECRET, ...)
          - pattern: logging.error(..., $SECRET, ...)
          - pattern: logging.warning(..., $SECRET, ...)
      - metavariable-regex:
          metavariable: $SECRET
          regex: "^[a-zA-Z_][a-zA-Z0-9_]*(secret|api_key|apikey|private_key|password|passwd|token|authkey)$"
    message: Evite registrar variáveis de segredo, token ou senha em logs.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-532"

  - id: media-pipeline-no-unsafe-yaml-load
    pattern: yaml.load($DATA)
    message: Use yaml.safe_load() em vez de yaml.load() sem Loader seguro para evitar desserialização insegura.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502"
