name: Legendar Série via FTP
run-name: "🎬 Legendar: ${{ inputs.video_filename }} [${{ inputs.whisper_model }} / ${{ inputs.translator }}] · ${{ inputs.network_mode }}"

on:
  workflow_dispatch:
    inputs:
      video_filename:
        description: 'Nome do arquivo de vídeo (ex: Uzak_Sehir_-_Episode_31.mp4)'
        required: true
        type: string
      season:
        description: 'Temporada'
        required: true
        type: choice
        options:
          - 'Segunda Temporada'
          - 'Terceira Temporada'
          - 'Primeira Temporada'
        default: 'Segunda Temporada'
      whisper_model:
        description: 'Modelo Whisper ASR (large-v3-q5_0 = Máxima Precisão 32 camadas; turbo = Mais Rápido)'
        required: true
        type: choice
        options:
          - 'large-v3-q5_0'
          - 'large-v3-turbo-q8_0'
          - 'large-v3'
        default: 'large-v3-q5_0'
      lang:
        description: 'Idioma do áudio original (ex: tr, en, auto)'
        required: false
        default: 'tr'
      translator:
        description: 'Motor de tradução (escolha "none" para apenas transcrever e subir o SRT original)'
        required: true
        type: choice
        options:
          - 'gemini'
          - 'huggingface'
          - 'openrouter'
          - 'groq'
          - 'local'
          - 'none'
        default: 'gemini'
      network_mode:
        description: Use Tailscale (wireguard.luisices.com.br), OpenVPN (vpn) ou conexão direta (direct)
        required: true
        type: choice
        options:
          - tailscale
          - vpn
          - direct
        default: tailscale
      usar_precache_audio:
        description: 'Usar pré-cache de áudio leve (.audio.m4a) se existir no FTP (com fallback automático para o .mp4)?'
        required: false
        type: boolean
        default: true
      executar_auditoria:
        description: 'Executar análise de integridade e regras da skill (Quality Gate)'
        required: false
        type: boolean
        default: true
      bloquear_em_falhas:
        description: 'Bloquear envio ao FTP se a auditoria reprovar (falso = apenas avisa)'
        required: false
        type: boolean
        default: false

env:
  FTP_BASE_DIR: "/G/Series/Longe demais - ${{ inputs.season }}"

jobs:
  prepare_audio:
    runs-on: ubuntu-latest
    env:
      LANG_INPUT: ${{ inputs.lang }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 curl

      - name: Validar Parâmetros e Caminhos
        env:
          VIDEO_NAME_INPUT: ${{ inputs.video_filename }}
          SEASON_INPUT: ${{ inputs.season }}
        run: |
          if [[ ! "$LANG_INPUT" =~ ^[A-Za-z][A-Za-z0-9_-]{0,15}$ ]]; then
            echo "Idioma inválido. Use um código simples, como tr, en ou auto." >&2
            exit 1
          fi
          VIDEO_NAME="$(echo "$VIDEO_NAME_INPUT" | xargs)"
          case "$VIDEO_NAME" in
            *.mp4) ;;
            *) echo "Nome de vídeo inválido: esperado arquivo .mp4" >&2; exit 1 ;;
          esac
          if [[ ! "$VIDEO_NAME" =~ ^[A-Za-z0-9_.-]+\.mp4$ ]]; then
            echo "O nome do vídeo contém caracteres não permitidos." >&2
            exit 1
          fi
          if [ "$VIDEO_NAME" != "$(basename "$VIDEO_NAME")" ]; then
            echo "Informe somente o nome do arquivo, sem diretórios." >&2
            exit 1
          fi
          STEM="${VIDEO_NAME%.*}"
          FTP_BASE_DIR="/G/Series/Longe demais - $SEASON_INPUT"
          echo "FTP_BASE_DIR=$FTP_BASE_DIR" >> "$GITHUB_ENV"
          echo "VIDEO_NAME=$VIDEO_NAME" >> "$GITHUB_ENV"
          echo "STEM=$STEM" >> "$GITHUB_ENV"

      - name: Conectar ao Tailscale / WireGuard (Galaxy A70)
        if: ${{ inputs.network_mode == 'tailscale' }}
        uses: ./.github/actions/tailscale-connect
        with:
          ts_authkey: ${{ secrets.TS_AUTHKEY }}
          oci_ssh_key: ${{ secrets.OCI_SSH_KEY }}
          openvpn_config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Conectar à VPN para acessar o FTP
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Baixar mídia do FTP (Pré-Cache de Áudio com Acionamento Automático no A70 e Fallback .mp4)
        env:
          FTP_HOST: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '192.168.0.1' || secrets.FTP_HOST }}
          FTP_PORT: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '21' || secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          SEASON_INPUT: ${{ inputs.season }}
          USE_PRECACHE: ${{ inputs.usar_precache_audio != false }}
        run: |
          ENCODED_AUDIO_PATH=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"] + "/" + os.environ["STEM"] + ".audio.m4a"))')
          ENCODED_VIDEO_PATH=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"] + "/" + os.environ["VIDEO_NAME"]))')
          AUDIO_URL="ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_AUDIO_PATH}"
          VIDEO_URL="ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_VIDEO_PATH}"

          if [ "$USE_PRECACHE" = "true" ]; then
            echo "⚡ Verificando disponibilidade de pré-cache de áudio (${STEM}.audio.m4a) em '${SEASON_INPUT}'..."
            if ! curl -sI --fail --ftp-pasv -u "$FTP_USER:$FTP_PASSWORD" "$AUDIO_URL" | grep -qi "Content-Length:"; then
              if [ -n "${TAILSCALE_TARGET:-}" ] && [ -n "${OCI_SSH_KEY:-}" ]; then
                echo "📲 Áudio ainda não separado. Acionando o Galaxy A70 (${TAILSCALE_TARGET}:2222) sob demanda para separar a faixa de áudio na rede local..."
                mkdir -p ~/.ssh
                printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/a70_key
                chmod 600 ~/.ssh/a70_key
                ssh -i ~/.ssh/a70_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p 2222 "u0_a615@${TAILSCALE_TARGET}" "~/precache_audios.sh '$STEM' '$SEASON_INPUT'" || true
              fi
            fi

            if curl -sI --fail --ftp-pasv -u "$FTP_USER:$FTP_PASSWORD" "$AUDIO_URL" | grep -qi "Content-Length:"; then
              echo "✅ Áudio leve disponível (${STEM}.audio.m4a)! Baixando em alta velocidade..."
              if python3 baixar_ftp_paralelo.py "$AUDIO_URL" input_media 4; then
                echo "🎉 Áudio leve baixado com sucesso!"
                exit 0
              fi
              echo "⚠️ Falha ao baixar áudio leve. Acionando fallback automático para o vídeo .mp4..."
            else
              echo "ℹ️ Áudio leve indisponível. Acionando fallback automático para o vídeo .mp4..."
            fi
          else
            echo "ℹ️ Opção usar_precache_audio desativada. Baixando vídeo .mp4 completo..."
          fi

          python3 baixar_ftp_paralelo.py "$VIDEO_URL" input_media 4

      - name: Desconectar da VPN após o download
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Extrair áudio e Fatiar em 4 partes por Silêncio
        run: |
          ffmpeg -hide_banner -loglevel warning -stats -threads $(nproc) -y \
            -i input_media -vn -af "highpass=f=200,lowpass=f=3500,volume=1.5" -acodec pcm_s16le -ar 16000 -ac 1 input.wav
          rm -f input_media
          python3 dividir_audio.py input.wav --parts 4 --output-dir audio_parts
          rm -f input.wav

      - name: Compartilhar Partes de Áudio
        uses: actions/upload-artifact@v4
        with:
          name: audio-parts
          path: audio_parts/
          retention-days: 1

  transcribe_part:
    needs: prepare_audio
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl libomp-dev

      - name: Cache do Whisper.cpp e Modelos GGML
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: |
            whisper.cpp/build
            whisper.cpp/models/ggml-${{ inputs.whisper_model }}.bin
            whisper.cpp/models/ggml-silero-v6.2.0.bin
          key: whisper-${{ inputs.whisper_model }}-vad-v4-nonative

      - name: Compilar whisper.cpp (Otimizado OpenMP) e Baixar Modelos
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build build --config Release -j$(nproc)
          sh ./models/download-ggml-model.sh ${{ inputs.whisper_model }}
          sh ./models/download-vad-model.sh silero-v6.2.0

      - name: Baixar Parte de Áudio
        uses: actions/download-artifact@v4
        with:
          name: audio-parts
          path: audio_parts

      - name: Transcrever Parte ${{ matrix.part }} com Whisper ${{ inputs.whisper_model }}
        env:
          LANG_INPUT: ${{ inputs.lang }}
        run: |
          NTHREADS=$(nproc)
          echo "Transcrevendo parte ${{ matrix.part }} com $NTHREADS núcleos usando ${{ inputs.whisper_model }}..."
          ./whisper.cpp/build/bin/whisper-cli \
            -m ./whisper.cpp/models/ggml-${{ inputs.whisper_model }}.bin \
            -vm ./whisper.cpp/models/ggml-silero-v6.2.0.bin \
            --vad \
            -f "audio_parts/part_${{ matrix.part }}.wav" \
            -l "$LANG_INPUT" \
            -t $NTHREADS \
            -sns \
            -mc 0 \
            --prompt "Uzak Şehir, Cihan, Alya, Dona Sadakat, Boran, Kaya, İpek, Şahin, Nare, Demir, Ecmel, Zerrin, Hamada, Fidan, Mardin" \
            -osrt \
            -of "part_${{ matrix.part }}"

      - name: Salvar Transcrição Parcial
        uses: actions/upload-artifact@v4
        with:
          name: whisper-part-${{ matrix.part }}
          path: part_${{ matrix.part }}.srt
          retention-days: 1

  merge_transcription:
    needs: [prepare_audio, transcribe_part]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar Partes Transcritas
        uses: actions/download-artifact@v4
        with:
          pattern: whisper-part-*
          path: whisper_parts
          merge-multiple: true

      - name: Baixar Metadados de Áudio
        uses: actions/download-artifact@v4
        with:
          name: audio-parts
          path: audio_parts

      - name: Conectar ao Tailscale / WireGuard (Galaxy A70)
        if: ${{ inputs.network_mode == 'tailscale' }}
        uses: ./.github/actions/tailscale-connect
        with:
          ts_authkey: ${{ secrets.TS_AUTHKEY }}
          oci_ssh_key: ${{ secrets.OCI_SSH_KEY }}
          openvpn_config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Conectar à VPN para acessar o FTP
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Mesclar e Normalizar Transcrição Completa
        env:
          VIDEO_NAME_INPUT: ${{ inputs.video_filename }}
          FTP_BASE_DIR: "/G/Series/Longe demais - ${{ inputs.season }}"
          FTP_HOST: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '192.168.0.1' || secrets.FTP_HOST }}
          FTP_PORT: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '21' || secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          export STEM="${VIDEO_NAME_INPUT%.*}"
          echo "STEM=$STEM" >> "$GITHUB_ENV"
          export FTP_BASE_DIR
          echo "FTP_BASE_DIR=$FTP_BASE_DIR" >> "$GITHUB_ENV"

          python3 mesclar_transcricao.py audio_parts/offsets.json "$STEM.srt" whisper_parts/part_*.srt
          python3 normalizar_timings.py "$STEM.srt" "$STEM.srt"
          cp "$STEM.srt" input.srt

          echo "Enviando arquivo original .srt para o FTP/SFTP..."
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          if [ "$FTP_PORT" = "22" ]; then
            curl -# --fail -k \
              --retry 5 --retry-delay 5 --retry-connrefused \
              -u "$FTP_USER:$FTP_PASSWORD" \
              -T "$STEM.srt" \
              "sftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"
          else
            curl -# --fail --ftp-pasv \
              --retry 5 --retry-delay 5 --retry-connrefused \
              -u "$FTP_USER:$FTP_PASSWORD" \
              -T "$STEM.srt" \
              "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"
          fi

      - name: Desconectar da VPN
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Salvar SRT original no GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: srt-${{ inputs.video_filename }}
          path: "*.srt"
          retention-days: 7

      - name: Compartilhar SRT Unificado
        if: ${{ inputs.translator != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-srt-input
          path: input.srt
          retention-days: 1

  prepare_local:
    if: ${{ inputs.translator == 'local' }}
    needs: merge_transcription
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache do modelo local Qwen3-8B Q4
        uses: actions/cache@v4
        with:
          path: models/Qwen3-8B-Q4_K_M.gguf
          key: qwen3-8b-q4-k-m-v1

      - name: Cache do servidor llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-b12034

      - name: Preparar modelo e servidor para os runners
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          mkdir -p models
          if [ ! -s models/Qwen3-8B-Q4_K_M.gguf ]; then
            curl --fail --location --retry 4 --retry-delay 3 \
              "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf?download=true" \
              -o models/Qwen3-8B-Q4_K_M.gguf
          fi
          if [ ! -x llama.cpp/build/bin/llama-server ]; then
            git clone --branch b12034 --depth 1 https://github.com/ggml-org/llama.cpp.git
            cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
            cmake --build llama.cpp/build --config Release --target llama-server --parallel 2
          fi

  translate_local:
    if: ${{ inputs.translator == 'local' }}
    needs: [merge_transcription, prepare_local]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restaurar cache do modelo
        uses: actions/cache@v4
        with:
          path: models/Qwen3-8B-Q4_K_M.gguf
          key: qwen3-8b-q4-k-m-v1

      - name: Restaurar cache do llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-b12034

      - name: Baixar SRT de entrada
        uses: actions/download-artifact@v4
        with:
          name: local-srt-input

      - name: Tunar Sistema e Recursos do Runner
        run: |
          echo "Otimizando memória e prioridade do runner..."
          sudo systemctl stop docker mysql containerd 2>/dev/null || true
          if [ ! -f /swapfile_tune ]; then
            sudo fallocate -l 8G /swapfile_tune || sudo dd if=/dev/zero of=/swapfile_tune bs=1M count=8192
            sudo chmod 600 /swapfile_tune
            sudo mkswap /swapfile_tune
            sudo swapon /swapfile_tune
          fi
          sudo sysctl -w vm.swappiness=10
          free -h

      - name: Iniciar modelo local neste runner
        run: |
          if [ ! -x llama.cpp/build/bin/llama-server ]; then
            echo "llama-server não foi encontrado no cache do build." >&2
            find llama.cpp/build -maxdepth 3 -type f -print 2>/dev/null | head -50 || true
            exit 1
          fi
          taskset -c 0,1 nice -n -20 nohup llama.cpp/build/bin/llama-server \
            -m models/Qwen3-8B-Q4_K_M.gguf \
            --alias qwen3-8b-local --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --threads 2 --threads-batch 2 --parallel 1 --reasoning off --jinja \
            > llama-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "llama-server pronto (PID $SERVER_PID)."
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "llama-server encerrou durante a inicialização. Log:" >&2
              cat llama-server.log >&2
              exit 1
            fi
            sleep 2
          done
          echo "Timeout aguardando llama-server. Log:" >&2
          cat llama-server.log >&2
          exit 1

      - name: Restaurar checkpoint de tradução (se houver)
        uses: actions/cache/restore@v4
        with:
          path: part-${{ matrix.part }}.ckpt.json
          key: ckpt-v2-leg-${{ inputs.video_filename }}-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          restore-keys: |
            ckpt-v2-leg-${{ inputs.video_filename }}-${{ matrix.part }}-

      - name: Traduzir parte ${{ matrix.part }} de 8
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 traduz_local.py -b 12 --parts 8 --part-index "${{ matrix.part }}" --partial-json \
            input.srt "part-${{ matrix.part }}.json"

      - name: Salvar checkpoint de tradução
        if: always() && hashFiles('part-*.ckpt.json') != ''
        uses: actions/cache/save@v4
        with:
          path: part-${{ matrix.part }}.ckpt.json
          key: ckpt-v2-leg-${{ inputs.video_filename }}-${{ matrix.part }}-attempt-${{ github.run_attempt }}

      - name: Salvar parte traduzida
        uses: actions/upload-artifact@v4
        with:
          name: local-part-${{ matrix.part }}
          path: part-${{ matrix.part }}.json
          retention-days: 1

  finalize_local:
    if: ${{ inputs.translator == 'local' }}
    needs: translate_local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar arquivo SRT original
        uses: actions/download-artifact@v4
        with:
          name: local-srt-input

      - name: Baixar as partes traduzidas
        uses: actions/download-artifact@v4
        with:
          pattern: local-part-*
          path: parts
          merge-multiple: true

      - name: Reunir tradução e gerar .ass
        env:
          VIDEO_NAME_INPUT: ${{ inputs.video_filename }}
          SEASON_INPUT: ${{ inputs.season }}
        run: |
          STEM="${VIDEO_NAME_INPUT%.*}"
          echo "STEM=$STEM" >> "$GITHUB_ENV"
          FTP_BASE_DIR="/G/Series/Longe demais - $SEASON_INPUT"
          echo "FTP_BASE_DIR=$FTP_BASE_DIR" >> "$GITHUB_ENV"

          python3 mesclar_traducao_local.py input.srt "$STEM.pt-BR.srt" parts/part-*.json
          python3 gerar_versoes_legendas.py "$STEM.pt-BR.srt" "$STEM" .

      - name: Quality Gate e Auditoria de Regras (Opcional)
        if: ${{ inputs.executar_auditoria != false }}
        continue-on-error: ${{ inputs.bloquear_em_falhas != true }}
        run: |
          echo "Executando Quality Gate e Auditoria de Regras da Skill..."
          python3 lint_legendas.py "$STEM.pt-BR.srt" \
            -o input.srt \
            -a "$STEM.ass" \
            --paired-srt "$STEM.com_orador.pt-BR.srt" \
            --summary-markdown "$GITHUB_STEP_SUMMARY" \
            ${{ inputs.bloquear_em_falhas == true && '--fail-on-skill-rules' || '--warn-only' }}

      - name: Conectar ao Tailscale / WireGuard (Galaxy A70)
        if: ${{ inputs.network_mode == 'tailscale' }}
        uses: ./.github/actions/tailscale-connect
        with:
          ts_authkey: ${{ secrets.TS_AUTHKEY }}
          oci_ssh_key: ${{ secrets.OCI_SSH_KEY }}
          openvpn_config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Conectar à VPN para enviar as legendas
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Enviar legendas traduzidas de volta para o FTP
        env:
          FTP_BASE_DIR: "/G/Series/Longe demais - ${{ inputs.season }}"
          FTP_HOST: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '192.168.0.1' || secrets.FTP_HOST }}
          FTP_PORT: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '21' || secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          curl --fail --ftp-pasv --retry 5 --retry-delay 5 --retry-connrefused \
            -u "$FTP_USER:$FTP_PASSWORD" -T "$STEM.pt-BR.srt" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"
          curl --fail --ftp-pasv --retry 5 --retry-delay 5 --retry-connrefused \
            -u "$FTP_USER:$FTP_PASSWORD" -T "$STEM.ass" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"

      - name: Desconectar da VPN
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Salvar artefatos no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendas-${{ inputs.video_filename }}
          path: |
            *.pt-BR.srt
            *.ass

  translate_api:
    if: ${{ inputs.translator != 'local' && inputs.translator != 'none' }}
    needs: merge_transcription
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar SRT de entrada
        uses: actions/download-artifact@v4
        with:
          name: local-srt-input

      - name: Traduzir para PT-BR (${{ inputs.translator }}) e Gerar .ass
        env:
          PYTHONUNBUFFERED: "1"
          VIDEO_NAME_INPUT: ${{ inputs.video_filename }}
          SEASON_INPUT: ${{ inputs.season }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_TRANSLATE_KEYS: ${{ secrets.GEMINI_TRANSLATE_KEYS }}
          GEMINI_TRANSLATE_KEY: ${{ secrets.GEMINI_TRANSLATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_KEY }}
        run: |
          STEM="${VIDEO_NAME_INPUT%.*}"
          echo "STEM=$STEM" >> "$GITHUB_ENV"
          FTP_BASE_DIR="/G/Series/Longe demais - $SEASON_INPUT"
          echo "FTP_BASE_DIR=$FTP_BASE_DIR" >> "$GITHUB_ENV"

          if [ "${{ inputs.translator }}" = "groq" ]; then
            echo "Traduzindo via Groq..."
            python3 traduz_groq.py input.srt "traducao_raw.srt"
          elif [ "${{ inputs.translator }}" = "huggingface" ]; then
            echo "Traduzindo via Hugging Face (Llama-3.3-70B-Instruct)..."
            python3 traduz_hf.py input.srt "traducao_raw.srt"
          elif [ "${{ inputs.translator }}" = "openrouter" ]; then
            echo "Traduzindo via OpenRouter (Llama-3.3-70B-Instruct)..."
            python3 traduz_openrouter.py input.srt "traducao_raw.srt"
          else
            echo "Traduzindo via Google Gemini..."
            python3 traduz_gemini.py -b 65 input.srt "traducao_raw.srt"
          fi
          echo "Gerando as duas versões de legendas (.com_orador e pura) em .srt e .ass..."
          python3 gerar_versoes_legendas.py "traducao_raw.srt" "$STEM" .

      - name: Quality Gate e Auditoria de Regras (Opcional)
        if: ${{ inputs.executar_auditoria != false }}
        continue-on-error: ${{ inputs.bloquear_em_falhas != true }}
        run: |
          echo "Executando Quality Gate e Auditoria de Regras da Skill..."
          python3 lint_legendas.py "$STEM.pt-BR.srt" \
            -o input.srt \
            -a "$STEM.ass" \
            --paired-srt "$STEM.com_orador.pt-BR.srt" \
            --summary-markdown "$GITHUB_STEP_SUMMARY" \
            ${{ inputs.bloquear_em_falhas == true && '--fail-on-skill-rules' || '--warn-only' }}

      - name: Conectar ao Tailscale / WireGuard (Galaxy A70)
        if: ${{ inputs.network_mode == 'tailscale' }}
        uses: ./.github/actions/tailscale-connect
        with:
          ts_authkey: ${{ secrets.TS_AUTHKEY }}
          oci_ssh_key: ${{ secrets.OCI_SSH_KEY }}
          openvpn_config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Conectar à VPN para enviar as legendas
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Enviar legendas traduzidas (.pt-BR.srt e .ass) de volta para o FTP
        env:
          FTP_BASE_DIR: "/G/Series/Longe demais - ${{ inputs.season }}"
          FTP_HOST: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '192.168.0.1' || secrets.FTP_HOST }}
          FTP_PORT: ${{ (inputs.network_mode == 'vpn' || inputs.network_mode == 'tailscale') && '21' || secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          echo "Enviando todas as versões de legendas geradas de volta para o FTP..."

          upload_file() {
            local f="$1"
            if [ -f "$f" ]; then
              if [ "$FTP_PORT" = "22" ]; then
                curl -# --fail -k --retry 5 --retry-delay 5 -u "$FTP_USER:$FTP_PASSWORD" -T "$f" "sftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"
              else
                curl -# --fail --ftp-pasv --retry 5 --retry-delay 5 -u "$FTP_USER:$FTP_PASSWORD" -T "$f" "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"
              fi
            fi
          }

          upload_file "$STEM.com_orador.pt-BR.srt"
          upload_file "$STEM.pt-BR.srt"
          upload_file "$STEM.com_orador.ass"
          upload_file "$STEM.ass"

      - name: Desconectar da VPN
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Salvar artefatos no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendas-${{ inputs.video_filename }}
          path: |
            *.srt
            *.ass

      - name: Notificar Conclusão via WhatsApp (Evolution API)
        if: ${{ success() }}
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          VIDEO_FILENAME_INPUT: ${{ inputs.video_filename }}
          SEASON_INPUT: ${{ inputs.season }}
        run: |
          MSG="🎉 Episódio *$VIDEO_FILENAME_INPUT* legendado com sucesso!\n📁 4 versões (.srt e .ass) sincronizadas no FTP ($SEASON_INPUT)."
          python3 notificar_whatsapp.py "$MSG" --status success || true

      - name: Notificar Falha via WhatsApp (Evolution API)
        if: ${{ failure() }}
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          VIDEO_FILENAME_INPUT: ${{ inputs.video_filename }}
        run: |
          MSG="⚠️ Falha ao legendar *$VIDEO_FILENAME_INPUT* no workflow GitHub Actions."
          python3 notificar_whatsapp.py "$MSG" --status error || true
