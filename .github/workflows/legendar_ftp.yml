name: Legendar Série via FTP
run-name: "🎬 Legendar: ${{ inputs.video_filename }} [${{ inputs.translator }}]"

on:
  workflow_dispatch:
    inputs:
      video_filename:
        description: 'Nome do arquivo de vídeo (ex: Uzak_Sehir_-_Episode_31.mp4)'
        required: true
        type: string
      lang:
        description: 'Idioma do áudio original (ex: tr, en, auto)'
        required: false
        default: 'tr'
      translator:
        description: 'Motor de tradução'
        required: true
        type: choice
        options:
          - 'gemini'
          - 'groq'
          - 'openrouter'
          - 'local'
        default: 'gemini'

jobs:
  transcribe-and-translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential python3 curl libomp-dev

      - name: Cache do Whisper.cpp e Modelos GGML
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: |
            whisper.cpp/build/bin
            whisper.cpp/models/ggml-large-v3-turbo-q8_0.bin
            whisper.cpp/models/ggml-silero-v6.2.0.bin
          key: whisper-turbo-q8-vad-v3

      - name: Compilar whisper.cpp (Otimizado OpenMP) e Baixar Modelos
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON
          cmake --build build --config Release -j$(nproc)
          sh ./models/download-ggml-model.sh large-v3-turbo-q8_0
          sh ./models/download-vad-model.sh silero-v6.2.0

      - name: Configurar Caminhos e Variáveis
        env:
          VIDEO_NAME_INPUT: ${{ inputs.video_filename }}
        run: |
          FTP_BASE_DIR="/G/Series/Longe demais - Segunda Temporada"
          VIDEO_NAME="$VIDEO_NAME_INPUT"
          case "$VIDEO_NAME" in
            *.mp4) ;;
            *) echo "Nome de vídeo inválido: esperado arquivo .mp4" >&2; exit 1 ;;
          esac
          if [[ ! "$VIDEO_NAME" =~ ^[A-Za-z0-9_.-]+\.mp4$ ]]; then
            echo "O nome do vídeo contém caracteres não permitidos." >&2
            exit 1
          fi
          if [ "$VIDEO_NAME" != "$(basename "$VIDEO_NAME")" ]; then
            echo "Informe somente o nome do arquivo, sem diretórios." >&2
            exit 1
          fi
          STEM="${VIDEO_NAME%.*}"
          
          echo "FTP_BASE_DIR=$FTP_BASE_DIR" >> $GITHUB_ENV
          echo "VIDEO_NAME=$VIDEO_NAME" >> $GITHUB_ENV
          echo "STEM=$STEM" >> $GITHUB_ENV

      - name: Baixar vídeo do FTP (Com Barra de Progresso)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ENCODED_PATH=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"] + "/" + os.environ["VIDEO_NAME"]))')
          
          echo "Baixando vídeo do FTP com barra de progresso e reconexão automática..."
          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -C - \
            -u "$FTP_USER:$FTP_PASSWORD" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_PATH}" \
            -o input_media

      - name: Extrair áudio em 16kHz Mono (FFmpeg Multi-thread)
        run: |
          ffmpeg -hide_banner -loglevel warning -stats -threads $(nproc) -y \
            -i input_media -vn -acodec pcm_s16le -ar 16000 -ac 1 input.wav
          rm -f input_media  # libera espaço no runner

      - name: Transcrever com Whisper Large-v3-Turbo + Silero VAD
        run: |
          NTHREADS=$(nproc)
          echo "Rodando Whisper com $NTHREADS núcleos..."
          ./whisper.cpp/build/bin/whisper-cli \
            -m ./whisper.cpp/models/ggml-large-v3-turbo-q8_0.bin \
            -vm ./whisper.cpp/models/ggml-silero-v6.2.0.bin \
            --vad \
            -f input.wav \
            -l ${{ inputs.lang }} \
            -t $NTHREADS \
            -sns \
            -mc 0 \
            -osrt \
            -of "${{ env.STEM }}"

      - name: Salvar Backup da Transcrição Original no FTP (Imediato)
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          if [ -f "${{ env.STEM }}.srt" ]; then
            echo "Enviando arquivo original .srt para o FTP..."
            curl -# --fail --ftp-pasv \
              --retry 5 --retry-delay 5 --retry-connrefused \
              -u "$FTP_USER:$FTP_PASSWORD" \
              -T "${{ env.STEM }}.srt" \
              "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/" || true
          fi

      - name: Cache do modelo local Qwen3-8B Q4
        if: inputs.translator == 'local'
        uses: actions/cache@v4
        with:
          path: models/qwen3-8b-q4_k_m.gguf
          key: qwen3-8b-q4-k-m-v1

      - name: Cache do servidor llama.cpp
        if: inputs.translator == 'local'
        uses: actions/cache@v4
        with:
          path: llama.cpp/build/bin/llama-server
          key: llama-server-ubuntu-cpu-v1

      - name: Preparar servidor local llama.cpp
        if: inputs.translator == 'local'
        run: |
          rm -f input.wav
          mkdir -p models
          if [ ! -s models/qwen3-8b-q4_k_m.gguf ]; then
            curl --fail --location --retry 4 --retry-delay 3 \
              "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/qwen3-8b-q4_k_m.gguf?download=true" \
              -o models/qwen3-8b-q4_k_m.gguf
          fi
          if [ ! -x llama.cpp/build/bin/llama-server ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
            cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
            cmake --build llama.cpp/build --config Release --target llama-server --parallel 2
          fi
          nohup llama.cpp/build/bin/llama-server \
            -m models/qwen3-8b-q4_k_m.gguf \
            --alias qwen3-8b-local --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --threads 4 --parallel 1 --reasoning off --jinja \
            > llama-server.log 2>&1 &
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8080/health

      - name: Traduzir para PT-BR (${{ inputs.translator }}) e Gerar .ass
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_TRANSLATE_KEY: ${{ secrets.GEMINI_TRANSLATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_KEY }}
        run: |
          if [ "${{ inputs.translator }}" = "groq" ]; then
            echo "Traduzindo via Groq..."
            python3 traduz_groq.py "${{ env.STEM }}.srt" "${{ env.STEM }}.pt-BR.srt"
          elif [ "${{ inputs.translator }}" = "openrouter" ]; then
            echo "Traduzindo via OpenRouter..."
            python3 traduz_openrouter.py "${{ env.STEM }}.srt" "${{ env.STEM }}.pt-BR.srt"
          elif [ "${{ inputs.translator }}" = "local" ]; then
            echo "Traduzindo com Qwen3-8B local (llama.cpp)..."
            python3 traduz_local.py -b 8 "${{ env.STEM }}.srt" "${{ env.STEM }}.pt-BR.srt"
          else
            echo "Traduzindo via Google Gemini..."
            python3 traduz_gemini.py -b 65 "${{ env.STEM }}.srt" "${{ env.STEM }}.pt-BR.srt"
          fi
          python3 srt_para_ass.py "${{ env.STEM }}.pt-BR.srt" "${{ env.STEM }}.ass"

      - name: Enviar legendas traduzidas (.pt-BR.srt e .ass) de volta para o FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          
          echo "Enviando legendas geradas de volta para o FTP..."
          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -u "$FTP_USER:$FTP_PASSWORD" \
            -T "${{ env.STEM }}.pt-BR.srt" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"

          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -u "$FTP_USER:$FTP_PASSWORD" \
            -T "${{ env.STEM }}.ass" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"

      - name: Salvar Legendas como Artifact de Backup no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendas-${{ env.STEM }}
          path: |
            ${{ env.STEM }}*.srt
            ${{ env.STEM }}*.ass
