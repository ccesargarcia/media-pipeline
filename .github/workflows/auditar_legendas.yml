name: "🔍 Auditar Legendas & Quality Gate (Skill)"
run-name: "🔍 Auditoria: ${{ inputs.alvo || 'Push / PR' }} ${{ inputs.episodio && format('Ep. {0}', inputs.episodio) || '' }}"

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Escopo da auditoria'
        required: true
        type: choice
        options:
          - 'todas_prontas'
          - 'episodio_especifico'
          - 'arquivo_customizado'
        default: 'todas_prontas'
      episodio:
        description: 'Número do episódio (usado se alvo for episodio_especifico, ex: 35, 36)'
        required: false
        type: string
        default: '36'
      caminho_arquivo:
        description: 'Caminho do arquivo .srt (usado se alvo for arquivo_customizado)'
        required: false
        type: string
        default: ''
      bloquear_em_falhas:
        description: 'Falhar o workflow se encontrar erros/inconsistências (falso = apenas relatório)'
        required: false
        type: boolean
        default: false
      modo_estrito:
        description: 'Modo estrito (reprova mesmo com avisos menores ou leitura acelerada)'
        required: false
        type: boolean
        default: false

  pull_request:
    paths:
      - 'legendas_prontas/**'
      - 'lint_legendas.py'
      - '.agents/skills/dizi-translator/SKILL.md'

jobs:
  auditar:
    name: "🔍 Auditar legendas selecionadas"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Auditoria de Legendas
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.bloquear_em_falhas != true || false }}
        env:
          AUDIT_TARGET: ${{ inputs.alvo || 'todas_prontas' }}
          AUDIT_EPISODE: ${{ inputs.episodio || '36' }}
          AUDIT_CUSTOM_PATH: ${{ inputs.caminho_arquivo || '' }}
          AUDIT_BLOCK: ${{ github.event_name == 'pull_request' || inputs.bloquear_em_falhas == true }}
          AUDIT_STRICT: ${{ inputs.modo_estrito == true }}
        run: |
          FLAGS=()
          if [[ "$AUDIT_BLOCK" == "true" ]]; then
            FLAGS+=(--fail-on-skill-rules)
          else
            FLAGS+=(--warn-only)
          fi
          if [[ "$AUDIT_STRICT" == "true" ]]; then
            FLAGS+=(--strict)
          fi

          run_lint() {
            local srt="$1" original="${2:-}" ass="${3:-}" paired="${4:-}"
            local args=("$srt")
            if [[ -n "$original" ]]; then args+=(-o "$original"); fi
            if [[ -n "$ass" ]]; then args+=(-a "$ass"); fi
            if [[ -n "$paired" ]]; then args+=(--paired-srt "$paired"); fi
            python3 lint_legendas.py "${args[@]}" "${FLAGS[@]}" --summary-markdown "$GITHUB_STEP_SUMMARY"
          }

          find_original() {
            local stem="$1"
            if [[ -f "${stem}.srt" ]]; then printf '%s' "${stem}.srt"
            elif [[ -f "${stem}.tr.srt" ]]; then printf '%s' "${stem}.tr.srt"
            fi
          }

          case "$AUDIT_TARGET" in
            episodio_especifico)
              if [[ ! "$AUDIT_EPISODE" =~ ^[0-9]{1,4}$ ]]; then
                echo "Número de episódio inválido." >&2; exit 2
              fi
              STEM="legendas_prontas/Uzak_Sehir_-_Episode_${AUDIT_EPISODE}"
              SRT="${STEM}.pt-BR.srt"
              if [[ ! -f "$SRT" ]]; then echo "Arquivo $SRT não encontrado." >&2; exit 1; fi
              ORIG="$(find_original "$STEM")"
              run_lint "$SRT" "$ORIG" "${STEM}.ass" "${STEM}.com_orador.pt-BR.srt"
              ;;
            arquivo_customizado)
              CUSTOM="$AUDIT_CUSTOM_PATH"
              if [[ "$CUSTOM" != *.srt || "$CUSTOM" == /* || "$CUSTOM" == *..* || ! -f "$CUSTOM" ]]; then
                echo "Caminho customizado inválido; informe um arquivo .srt relativo ao repositório." >&2; exit 2
              fi
              STEM="${CUSTOM%.pt-BR.srt}"
              ASS=""
              PAIRED=""
              [[ -f "${STEM}.ass" ]] && ASS="${STEM}.ass"
              [[ -f "${STEM}.com_orador.pt-BR.srt" ]] && PAIRED="${STEM}.com_orador.pt-BR.srt"
              run_lint "$CUSTOM" "" "$ASS" "$PAIRED"
              ;;
            todas_prontas)
              FILES=()
              while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find legendas_prontas -type f -name '*.pt-BR.srt' ! -name '*.com_orador.pt-BR.srt' -print0 | sort -z)
              if ((${#FILES[@]} == 0)); then echo "Nenhuma legenda encontrada em legendas_prontas/"; exit 0; fi
              echo "### 📊 Auditoria em lote" >> "$GITHUB_STEP_SUMMARY"
              FAILED=0
              for SRT in "${FILES[@]}"; do
                STEM="${SRT%.pt-BR.srt}"
                ORIG="$(find_original "$STEM")"
                ASS=""
                PAIRED=""
                [[ -f "${STEM}.ass" ]] && ASS="${STEM}.ass"
                [[ -f "${STEM}.com_orador.pt-BR.srt" ]] && PAIRED="${STEM}.com_orador.pt-BR.srt"
                echo "Auditando: $SRT"
                if run_lint "$SRT" "$ORIG" "$ASS" "$PAIRED"; then :; else FAILED=1; fi
              done
              exit "$FAILED"
              ;;
            *) echo "Escopo de auditoria inválido." >&2; exit 2 ;;
          esac
