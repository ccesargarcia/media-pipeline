name: Semgrep

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Send scan to Semgrep Cloud (SaaS)
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "SEMGREP_APP_TOKEN não configurado; pulando envio ao Semgrep Cloud."
            exit 0
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${GITHUB_EVENT_PATH}:${GITHUB_EVENT_PATH}:ro" \
            --workdir /src \
            -e SEMGREP_APP_TOKEN \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e GITHUB_HEAD_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_SHA \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_EVENT_PATH \
            -e GITHUB_RUN_ID \
            -e GITHUB_SERVER_URL \
            semgrep/semgrep:latest \
            semgrep ci

      - name: Run Semgrep scan (SARIF)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            --workdir /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config p/python \
            --config p/github-actions \
            --config p/security-audit \
            --config p/secrets \
            --config .semgrep/media-pipeline.yml \
            --metrics=off \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: Upload Semgrep SARIF to GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Report media-pipeline custom & secrets findings (non-blocking)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            --workdir /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config .semgrep/media-pipeline.yml \
            --config p/secrets \
            --severity ERROR \
            --metrics=off \
            .
