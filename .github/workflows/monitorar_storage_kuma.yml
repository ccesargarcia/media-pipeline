name: Monitorar Espaço do HD no Uptime Kuma

on:
  schedule:
    # Executa a cada 1 hora
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor_storage:
    name: Checar Disco e Notificar Uptime Kuma
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar smbprotocol
        run: pip3 install smbprotocol

      - name: Conectar à VPN
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Executar Checagem e Atualizar Uptime Kuma
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 monitorar_storage_uptime_kuma.py \
            --host 192.168.0.1 \
            --share G \
            --user "$FTP_USER" \
            --password "$FTP_PASSWORD" \
            --min-gb 20

      - name: Desconectar da VPN
        if: always()
        uses: ./.github/actions/openvpn-disconnect
