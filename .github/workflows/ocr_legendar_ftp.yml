name: Extrair Hardsub (OCR) e Traduzir via FTP
run-name: "🔍 Hardsub OCR + Traduzir: ${{ inputs.video_filename }} [${{ inputs.translator }}]"

on:
  workflow_dispatch:
    inputs:
      video_filename:
        description: 'Nome do arquivo de vídeo no FTP (ex: Uzak_Sehir_-_Episode_31.mp4)'
        required: true
        type: string
        default: 'Uzak_Sehir_-_Episode_31.mp4'
      season:
        description: 'Pasta da Temporada no FTP'
        required: true
        type: choice
        options:
          - 'Segunda Temporada'
          - 'Primeira Temporada'
          - 'Terceira Temporada'
        default: 'Segunda Temporada'
      translator:
        description: 'Motor de tradução para PT-BR'
        required: true
        type: choice
        options:
          - 'gemini'
          - 'groq'
          - 'openrouter'
        default: 'gemini'
      ocr_fps:
        description: 'Taxa de amostragem de frames por segundo para OCR (padrão: 2.0)'
        required: false
        default: '2.0'
      crop_pct:
        description: 'Fração inferior da tela para OCR (padrão: 0.20 = 20% inferiores)'
        required: false
        default: '0.20'

jobs:
  ocr-and-translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Sistema (FFmpeg + Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng libtesseract-dev curl
          pip install pytesseract pillow requests

      - name: Configurar Caminhos e Variáveis
        run: |
          FTP_BASE_DIR="/G/Series/Longe demais - ${{ inputs.season }}"
          VIDEO_NAME="${{ inputs.video_filename }}"
          STEM="${VIDEO_NAME%.*}"
          
          echo "FTP_BASE_DIR=$FTP_BASE_DIR" >> $GITHUB_ENV
          echo "VIDEO_NAME=$VIDEO_NAME" >> $GITHUB_ENV
          echo "STEM=$STEM" >> $GITHUB_ENV

      - name: Baixar vídeo do FTP
        run: |
          ENCODED_PATH=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"] + "/" + os.environ["VIDEO_NAME"]))')
          
          echo "Baixando $VIDEO_NAME do FTP (${{ env.FTP_BASE_DIR }})..."
          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -C - \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}:${{ secrets.FTP_PORT }}${ENCODED_PATH}" \
            -o input_media.mp4

      - name: Extrair Legendas em Inglês Hardcoded via OCR
        run: |
          echo "Iniciando extração inteligente de legendas em inglês..."
          python3 extrair_hardsub_ocr.py \
            input_media.mp4 \
            "${{ env.STEM }}.en.srt" \
            --fps ${{ inputs.ocr_fps }} \
            --crop-pct ${{ inputs.crop_pct }} \
            --threshold 200
          
          rm -f input_media.mp4  # Libera espaço imediatamente

      - name: Traduzir Legenda de Inglês para PT-BR (${{ inputs.translator }})
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_TRANSLATE_KEY: ${{ secrets.GEMINI_TRANSLATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ inputs.translator }}" = "groq" ]; then
            echo "Traduzindo via Groq..."
            python3 traduz_groq.py "${{ env.STEM }}.en.srt" "${{ env.STEM }}.pt-BR.srt"
          elif [ "${{ inputs.translator }}" = "openrouter" ]; then
            echo "Traduzindo via OpenRouter..."
            python3 traduz_openrouter.py "${{ env.STEM }}.en.srt" "${{ env.STEM }}.pt-BR.srt"
          else
            echo "Traduzindo via Google Gemini..."
            python3 traduz_gemini.py -b 65 "${{ env.STEM }}.en.srt" "${{ env.STEM }}.pt-BR.srt"
          fi

      - name: Normalizar Timings e Gerar Legendas .ass
        run: |
          echo "Normalizando tempos e gerando formato .ass com tarja preta e texto amarelo..."
          python3 normalizar_timings.py "${{ env.STEM }}.pt-BR.srt" "${{ env.STEM }}.pt-BR.srt"
          python3 srt_para_ass.py "${{ env.STEM }}.pt-BR.srt" "${{ env.STEM }}.ass"

      - name: Enviar legendas para o FTP (.en.srt, .pt-BR.srt e .ass)
        run: |
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          
          echo "Enviando legendas geradas para o FTP..."
          
          # Envia .pt-BR.srt
          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T "${{ env.STEM }}.pt-BR.srt" \
            "ftp://${{ secrets.FTP_HOST }}:${{ secrets.FTP_PORT }}${ENCODED_DIR}/"

          # Envia .ass
          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T "${{ env.STEM }}.ass" \
            "ftp://${{ secrets.FTP_HOST }}:${{ secrets.FTP_PORT }}${ENCODED_DIR}/"

          # Envia cópia do inglês extraído
          curl -# --fail --ftp-pasv \
            --retry 5 --retry-delay 5 --retry-connrefused \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -T "${{ env.STEM }}.en.srt" \
            "ftp://${{ secrets.FTP_HOST }}:${{ secrets.FTP_PORT }}${ENCODED_DIR}/" || true

      - name: Salvar Legendas como Artifact de Backup no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendas-ocr-${{ env.STEM }}
          path: |
            ${{ env.STEM }}.en.srt
            ${{ env.STEM }}.pt-BR.srt
            ${{ env.STEM }}.ass
