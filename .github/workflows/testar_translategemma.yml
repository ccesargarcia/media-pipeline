name: Testar Modelos Locais em paralelo
run-name: "🧪 ${{ inputs.model }}: ${{ inputs.srt_filename }} · 8 shards"

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo local para teste'
        required: true
        type: choice
        options:
          - 'gemma-3-4b'
          - 'aya-23-8b'
          - 'llama-3.1-8b'
          - 'qwen3-8b'
        default: 'gemma-3-4b'
      srt_filename:
        description: 'Nome do SRT original no FTP (ex: Uzak_Sehir_-_Episode_37.srt)'
        required: true
        type: string
        default: 'Uzak_Sehir_-_Episode_37.srt'
      season:
        description: Temporada da série no FTP
        required: true
        type: choice
        options:
          - 'Segunda Temporada'
          - 'Terceira Temporada'
          - 'Primeira Temporada'
        default: 'Segunda Temporada'
      network_mode:
        description: Use OpenVPN ou a conexão direta do runner para acessar o FTP
        required: true
        type: choice
        options:
          - vpn
          - direct
        default: vpn

permissions:
  contents: read

jobs:
  prepare_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Parâmetros Específicos do Modelo
        run: |
          case "${{ inputs.model }}" in
            "gemma-3-4b")
              echo "MODEL_FILE=models/gemma-3-4b-it-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_URL=https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf?download=true" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=gemma-3-4b-it-local" >> "$GITHUB_ENV"
              ;;
            "aya-23-8b")
              echo "MODEL_FILE=models/aya-23-8B-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_URL=https://huggingface.co/lmstudio-community/aya-23-8B-GGUF/resolve/main/aya-23-8B-Q4_K_M.gguf?download=true" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=aya-23-8b-local" >> "$GITHUB_ENV"
              ;;
            "llama-3.1-8b")
              echo "MODEL_FILE=models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_URL=https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf?download=true" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=llama-3.1-8b-local" >> "$GITHUB_ENV"
              ;;
            "qwen3-8b")
              echo "MODEL_FILE=models/Qwen3-8B-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_URL=https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf?download=true" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=qwen3-8b-local" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Conectar à VPN para baixar a legenda
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Baixar SRT original do FTP
        env:
          FTP_BASE_DIR: "/G/Series/Longe demais - ${{ inputs.season }}"
          SRT_NAME_INPUT: ${{ inputs.srt_filename }}
          FTP_HOST: ${{ inputs.network_mode == 'vpn' && '192.168.0.1' || secrets.FTP_HOST }}
          FTP_PORT: ${{ inputs.network_mode == 'vpn' && '21' || secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          export SRT_NAME="$SRT_NAME_INPUT"
          if [ "$SRT_NAME" != "$(basename "$SRT_NAME")" ] || [[ ! "$SRT_NAME" =~ ^[A-Za-z0-9_.-]+\.srt$ ]]; then
            echo "Informe somente o nome de um arquivo .srt válido." >&2
            exit 1
          fi
          ENCODED_PATH=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"] + "/" + os.environ["SRT_NAME"]))')
          curl --fail --ftp-pasv --retry 5 --retry-delay 5 --retry-connrefused \
            -u "$FTP_USER:$FTP_PASSWORD" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_PATH}" -o input.srt

      - name: Desconectar da VPN após o download
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Cache do Modelo GGUF
        uses: actions/cache@v4
        with:
          path: models
          key: model-cache-${{ inputs.model }}-v1

      - name: Cache do llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-v2

      - name: Baixar Modelo e Compilar llama.cpp
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          mkdir -p models
          if [ ! -s "$MODEL_FILE" ]; then
            echo "Baixando modelo ${{ inputs.model }} de $MODEL_URL..."
            curl --fail --location --retry 4 --retry-delay 3 "$MODEL_URL" -o "$MODEL_FILE"
          fi
          if [ ! -x llama.cpp/build/bin/llama-server ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
            cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON \
              -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
            cmake --build llama.cpp/build --config Release --target llama-server --parallel 2
          fi

      - name: Compartilhar SRT de entrada
        uses: actions/upload-artifact@v4
        with:
          name: test-srt-input
          path: input.srt
          retention-days: 1

  translate_test:
    needs: prepare_test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Parâmetros Específicos do Modelo
        run: |
          case "${{ inputs.model }}" in
            "gemma-3-4b")
              echo "MODEL_FILE=models/gemma-3-4b-it-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=gemma-3-4b-it-local" >> "$GITHUB_ENV"
              echo "SERVER_ARGS=--ctx-size 3072 --threads 2 --threads-batch 2 --parallel 1 --jinja" >> "$GITHUB_ENV"
              ;;
            "aya-23-8b")
              echo "MODEL_FILE=models/aya-23-8B-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=aya-23-8b-local" >> "$GITHUB_ENV"
              # Aya uses /completion with its explicit Cohere prompt in traduz_local.py.
              echo "SERVER_ARGS=--ctx-size 4096 --threads 2 --threads-batch 2 --parallel 1" >> "$GITHUB_ENV"
              ;;
            "llama-3.1-8b")
              echo "MODEL_FILE=models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=llama-3.1-8b-local" >> "$GITHUB_ENV"
              echo "SERVER_ARGS=--ctx-size 3072 --threads 2 --threads-batch 2 --parallel 1 --jinja" >> "$GITHUB_ENV"
              ;;
            "qwen3-8b")
              echo "MODEL_FILE=models/Qwen3-8B-Q4_K_M.gguf" >> "$GITHUB_ENV"
              echo "MODEL_ALIAS=qwen3-8b-local" >> "$GITHUB_ENV"
              echo "SERVER_ARGS=--ctx-size 4096 --threads 2 --threads-batch 2 --parallel 1 --reasoning off --jinja" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Restaurar cache do Modelo
        uses: actions/cache@v4
        with:
          path: models
          key: model-cache-${{ inputs.model }}-v1

      - name: Restaurar cache do llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-v2

      - name: Restaurar checkpoint de tradução (se houver)
        uses: actions/cache/restore@v4
        with:
          path: part-${{ matrix.part }}.ckpt.json
          key: ckpt-test-v4-${{ inputs.model }}-${{ inputs.srt_filename }}-${{ matrix.part }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          restore-keys: |
            ckpt-test-v4-${{ inputs.model }}-${{ inputs.srt_filename }}-${{ matrix.part }}-

      - name: Baixar SRT de entrada
        uses: actions/download-artifact@v4
        with:
          name: test-srt-input

      - name: Tunar Sistema e Recursos do Runner
        run: |
          echo "Otimizando memória e prioridade do runner..."
          sudo systemctl stop docker mysql containerd 2>/dev/null || true
          if [ ! -f /swapfile_tune ]; then
            sudo fallocate -l 8G /swapfile_tune || sudo dd if=/dev/zero of=/swapfile_tune bs=1M count=8192
            sudo chmod 600 /swapfile_tune
            sudo mkswap /swapfile_tune
            sudo swapon /swapfile_tune
          fi
          sudo sysctl -w vm.swappiness=10
          free -h

      - name: Iniciar ${{ inputs.model }} neste runner
        run: |
          if [ ! -s "$MODEL_FILE" ] || [ ! -x llama.cpp/build/bin/llama-server ]; then
            echo "Modelo ou llama-server não foi encontrado no cache." >&2
            exit 1
          fi
          taskset -c 0,1 nice -n -20 nohup llama.cpp/build/bin/llama-server \
            -m "$MODEL_FILE" \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8080 \
            $SERVER_ARGS \
            > llama-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "${{ inputs.model }} pronto (PID $SERVER_PID)."
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "llama-server encerrou durante a inicialização. Log:" >&2
              cat llama-server.log >&2
              exit 1
            fi
            sleep 2
          done
          echo "Timeout aguardando ${{ inputs.model }}. Log:" >&2
          cat llama-server.log >&2
          exit 1

      - name: Traduzir shard ${{ matrix.part }} de 8
        run: |
          : "${MODEL_ALIAS:?MODEL_ALIAS não foi configurado}"
          LOCAL_LLM_MODEL="$MODEL_ALIAS" PYTHONUNBUFFERED=1 python3 traduz_local.py -b 12 --parts 8 --part-index "${{ matrix.part }}" --partial-json \
            input.srt "part-${{ matrix.part }}.json"

      - name: Exibir log do llama-server em caso de falha
        if: failure()
        run: |
          echo "=== LLAMA-SERVER.LOG ==="
          cat llama-server.log 2>/dev/null | tail -n 80 || true

      - name: Salvar checkpoint de tradução
        if: always()
        uses: actions/cache/save@v4
        with:
          path: part-${{ matrix.part }}.ckpt.json
          key: ckpt-test-v4-${{ inputs.model }}-${{ inputs.srt_filename }}-${{ matrix.part }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}

      - name: Salvar shard traduzido
        uses: actions/upload-artifact@v4
        with:
          name: test-part-${{ matrix.part }}
          path: part-${{ matrix.part }}.json
          retention-days: 1

  finalize_test:
    needs: translate_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar SRT original
        uses: actions/download-artifact@v4
        with:
          name: test-srt-input

      - name: Baixar os shards traduzidos
        uses: actions/download-artifact@v4
        with:
          pattern: test-part-*
          path: parts
          merge-multiple: true

      - name: Reunir tradução e gerar ASS
        env:
          SRT_NAME_INPUT: ${{ inputs.srt_filename }}
        run: |
          STEM="${SRT_NAME_INPUT%.srt}"
          STEM="${STEM%.tr}"
          python3 mesclar_traducao_local.py input.srt "$STEM.pt-BR.srt" parts/part-*.json
          python3 srt_para_ass.py "$STEM.pt-BR.srt" "$STEM.ass"

      - name: Publicar artefatos para revisão
        uses: actions/upload-artifact@v4
        with:
          name: teste-${{ inputs.model }}-${{ inputs.srt_filename }}
          path: |
            *.pt-BR.srt
            *.ass
          retention-days: 7
