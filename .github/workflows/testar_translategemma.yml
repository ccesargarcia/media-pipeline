name: Testar Gemma 3 4B Instruct em paralelo
run-name: "🧪 Gemma 3 4B: ${{ inputs.srt_filename }} · 8 shards"

on:
  workflow_dispatch:
    inputs:
      srt_filename:
        description: 'Nome do SRT original no FTP (ex: Uzak_Sehir_-_Episode_37.srt)'
        required: true
        type: string
        default: 'Uzak_Sehir_-_Episode_37.srt'
      season:
        description: Temporada da série no FTP
        required: true
        type: choice
        options:
          - 'Segunda Temporada'
          - 'Terceira Temporada'
          - 'Primeira Temporada'
        default: 'Segunda Temporada'
      network_mode:
        description: Use OpenVPN ou a conexão direta do runner para acessar o FTP
        required: true
        type: choice
        options:
          - vpn
          - direct
        default: vpn

permissions:
  contents: read

jobs:
  prepare_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Conectar à VPN para baixar a legenda
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Baixar SRT original do FTP
        env:
          FTP_BASE_DIR: "/G/Series/Longe demais - ${{ inputs.season }}"
          SRT_NAME_INPUT: ${{ inputs.srt_filename }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          export SRT_NAME="$SRT_NAME_INPUT"
          if [ "$SRT_NAME" != "$(basename "$SRT_NAME")" ] || [[ ! "$SRT_NAME" =~ ^[A-Za-z0-9_.-]+\.srt$ ]]; then
            echo "Informe somente o nome de um arquivo .srt válido." >&2
            exit 1
          fi
          ENCODED_PATH=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"] + "/" + os.environ["SRT_NAME"]))')
          curl --fail --ftp-pasv --retry 5 --retry-delay 5 --retry-connrefused \
            -u "$FTP_USER:$FTP_PASSWORD" \
            "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_PATH}" -o input.srt

      - name: Desconectar da VPN após o download
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Cache do Gemma 3 4B Instruct Q4_K_M
        uses: actions/cache@v4
        with:
          path: models/gemma-3-4b-it-Q4_K_M.gguf
          key: gemma-3-4b-it-q4-k-m-v1

      - name: Cache do llama.cpp v0.8.0
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-v0.8.0

      - name: Baixar Gemma 3 e compilar llama.cpp
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          mkdir -p models
          if [ ! -s models/gemma-3-4b-it-Q4_K_M.gguf ]; then
            curl --fail --location --retry 4 --retry-delay 3 \
              "https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf?download=true" \
              -o models/gemma-3-4b-it-Q4_K_M.gguf
          fi
          if [ ! -x llama.cpp/build/bin/llama-server ]; then
            git clone --branch v0.8.0 --depth 1 https://github.com/ggml-org/llama.cpp.git
            cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
            cmake --build llama.cpp/build --config Release --target llama-server --parallel 2
          fi

      - name: Compartilhar SRT de entrada
        uses: actions/upload-artifact@v4
        with:
          name: gemma3-srt-input
          path: input.srt
          retention-days: 1

  translate_test:
    needs: prepare_test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restaurar cache do Gemma 3
        uses: actions/cache@v4
        with:
          path: models/gemma-3-4b-it-Q4_K_M.gguf
          key: gemma-3-4b-it-q4-k-m-v1

      - name: Restaurar cache do llama.cpp
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-ubuntu-cpu-v0.8.0

      - name: Baixar SRT de entrada
        uses: actions/download-artifact@v4
        with:
          name: gemma3-srt-input

      - name: Iniciar Gemma 3 neste runner
        run: |
          if [ ! -s models/gemma-3-4b-it-Q4_K_M.gguf ] || [ ! -x llama.cpp/build/bin/llama-server ]; then
            echo "Modelo ou llama-server não foi encontrado no cache." >&2
            exit 1
          fi
          nohup llama.cpp/build/bin/llama-server \
            -m models/gemma-3-4b-it-Q4_K_M.gguf \
            --alias gemma-3-4b-it-local --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --threads 2 --threads-batch 2 --parallel 1 --reasoning off --jinja \
            > llama-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "Gemma 3 pronto (PID $SERVER_PID)."
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "llama-server encerrou durante a inicialização. Log:" >&2
              cat llama-server.log >&2
              exit 1
            fi
            sleep 2
          done
          echo "Timeout aguardando Gemma 3. Log:" >&2
          cat llama-server.log >&2
          exit 1

      - name: Traduzir shard ${{ matrix.part }} de 8
        env:
          LOCAL_LLM_MODEL: gemma-3-4b-it-local
          PYTHONUNBUFFERED: "1"
        run: |
          python3 traduz_local.py -b 12 --parts 8 --part-index "${{ matrix.part }}" --partial-json \
            input.srt "part-${{ matrix.part }}.json"

      - name: Salvar shard traduzido
        uses: actions/upload-artifact@v4
        with:
          name: gemma3-part-${{ matrix.part }}
          path: part-${{ matrix.part }}.json
          retention-days: 1

  finalize_test:
    needs: translate_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar SRT original
        uses: actions/download-artifact@v4
        with:
          name: gemma3-srt-input

      - name: Baixar os shards traduzidos
        uses: actions/download-artifact@v4
        with:
          pattern: gemma3-part-*
          path: parts
          merge-multiple: true

      - name: Reunir tradução e gerar ASS
        env:
          SRT_NAME_INPUT: ${{ inputs.srt_filename }}
        run: |
          STEM="${SRT_NAME_INPUT%.srt}"
          STEM="${STEM%.tr}"
          python3 mesclar_traducao_local.py input.srt "$STEM.pt-BR.srt" parts/part-*.json
          python3 srt_para_ass.py "$STEM.pt-BR.srt" "$STEM.ass"

      - name: Publicar artefatos para revisão
        uses: actions/upload-artifact@v4
        with:
          name: teste-gemma3-${{ inputs.srt_filename }}
          path: |
            *.pt-BR.srt
            *.ass
          retention-days: 7
