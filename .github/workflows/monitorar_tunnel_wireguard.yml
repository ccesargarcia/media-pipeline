name: "🛡️ Validar Túnel WireGuard / Tailscale (Galaxy A70) & WhatsApp"
run-name: "🛡️ Validar Túnel A70 (wireguard.luisices.com.br) · [${{ inputs.modo_conexao || 'tailscale' }}]"

on:
  workflow_dispatch:
    inputs:
      modo_conexao:
        description: 'Modo de conexão (tailscale = via wireguard.luisices.com.br | openvpn = via OpenVPN do roteador)'
        required: true
        type: choice
        options:
          - 'tailscale'
          - 'openvpn'
        default: 'tailscale'
      notificar_sucesso:
        description: 'Enviar notificação no WhatsApp ao concluir?'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validar_tunnel:
    name: "Validar Ponte Galaxy A70 (${{ inputs.modo_conexao || 'tailscale' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Conectar via Tailscale / WireGuard (wireguard.luisices.com.br)
        if: (inputs.modo_conexao || 'tailscale') == 'tailscale'
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          # Abre encaminhamento local das portas do wireguard.luisices.com.br (100.97.222.39) pelo nó Tailscale
          ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=no -f -N \
            -L 2222:wireguard.luisices.com.br:2222 \
            -L 1080:wireguard.luisices.com.br:1080 \
            -L 2121:wireguard.luisices.com.br:2121 \
            -L 5555:wireguard.luisices.com.br:5555 \
            ubuntu@137.131.195.163
          echo "TARGET_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DISPLAY_HOST=wireguard.luisices.com.br (100.97.222.39)" >> "$GITHUB_ENV"

      - name: Conectar via OpenVPN (opção alternativa)
        if: inputs.modo_conexao == 'openvpn'
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Definir host para OpenVPN
        if: inputs.modo_conexao == 'openvpn'
        run: |
          echo "TARGET_HOST=192.168.0.252" >> "$GITHUB_ENV"
          echo "DISPLAY_HOST=192.168.0.252 (OpenVPN)" >> "$GITHUB_ENV"

      - name: Validar DNS, Ponte Galaxy A70 (SSH, SOCKS5, FTP Forward) e Túnel
        id: check
        env:
          MODE_USED: ${{ inputs.modo_conexao || 'tailscale' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys
          import time
          from ftplib import FTP

          target_host = os.environ["TARGET_HOST"]
          display_host = os.environ["DISPLAY_HOST"]
          mode_used = os.environ["MODE_USED"]
          ftp_user = os.environ["FTP_USER"]
          ftp_pass = os.environ["FTP_PASSWORD"]

          results = []
          errors = []

          # 1. Validar DNS Cloudflare (wireguard.luisices.com.br -> 100.97.222.39)
          try:
              dns_ip = socket.gethostbyname("wireguard.luisices.com.br")
              if dns_ip == "100.97.222.39":
                  results.append(f"✅ DNS: wireguard.luisices.com.br -> {dns_ip}")
              else:
                  errors.append(f"⚠️ DNS inesperado: wireguard.luisices.com.br -> {dns_ip}")
          except Exception as e:
              errors.append(f"❌ DNS wireguard.luisices.com.br falhou: {e}")

          # 2. Validar portas da Ponte Galaxy A70 (2222 SSH, 1080 SOCKS5, 2121 FTP Bridge, 5555 ADB Bridge)
          ports = {
              2222: "SSH Termux (A70)",
              1080: "Proxy SOCKS5 (microsocks)",
              2121: "Ponte FTP Roteador (socat)",
              5555: "Ponte ADB Fire TV (socat)",
          }
          for port, desc in ports.items():
              t0 = time.time()
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(8)
              try:
                  s.connect((target_host, port))
                  ms = int((time.time() - t0) * 1000)
                  results.append(f"✅ Porta {port} ({desc}): ONLINE ({ms}ms)")
              except Exception as e:
                  errors.append(f"❌ Porta {port} ({desc}) em {display_host}: OFFLINE ({e})")
              finally:
                  s.close()

          # 3. Validar Login FTP e Listagem de Episódios ATRAVÉS da Ponte Galaxy A70 (porta 2121)
          try:
              ftp = FTP()
              ftp.connect(target_host, 2121, timeout=15)
              ftp.login(ftp_user, ftp_pass)
              ftp.cwd("/G/Series/Longe demais - Segunda Temporada")
              stat_res = ftp.sendcmd("STAT .")
              ftp.quit()
              mp4_count = stat_res.count(".mp4")
              srt_count = stat_res.count(".pt-BR.srt")
              results.append(f"✅ FTP via Ponte A70 ({display_host}:2121): OK ({mp4_count} vídeos .mp4, {srt_count} legendas .pt-BR.srt)")
          except Exception as e:
              errors.append(f"❌ FTP via Ponte A70 ({display_host}:2121) falhou: {e}")

          summary_lines = [f"🛡️ *Validação da Ponte Galaxy A70 ({mode_used.upper()})*"]
          summary_lines.extend(results)
          if errors:
              summary_lines.extend(errors)

          report = "\n".join(summary_lines)
          print(report)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("report<<EOF\n" + report + "\nEOF\n")
              fh.write(f"has_errors={'true' if errors else 'false'}\n")

          if errors:
              sys.exit(1)
          PY

      - name: Desconectar OpenVPN
        if: always() && inputs.modo_conexao == 'openvpn'
        uses: ./.github/actions/openvpn-disconnect

      - name: Enviar Notificação de Sucesso via WhatsApp
        if: success() && inputs.notificar_sucesso != false
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          REPORT_MSG: ${{ steps.check.outputs.report }}
        run: |
          python3 notificar_whatsapp.py "$REPORT_MSG" --status success

      - name: Enviar Alerta de Falha via WhatsApp
        if: failure()
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          REPORT_MSG: ${{ steps.check.outputs.report || '❌ Falha crítica ao estabelecer túnel com a Ponte Galaxy A70.' }}
        run: |
          python3 notificar_whatsapp.py "$REPORT_MSG" --status error
