name: "🛡️ Monitorar Túnel WireGuard / Tailscale (Galaxy A70) & WhatsApp"
run-name: "🛡️ Validar & Monitorar Túnel A70 (wireguard.luisices.com.br) · ${{ inputs.modo_conexao || 'auto' }}"

on:
  workflow_dispatch:
    inputs:
      modo_conexao:
        description: 'Modo de conexão da nuvem para validar a ponte A70'
        required: true
        type: choice
        options:
          - 'auto'
          - 'tailscale'
          - 'openvpn'
        default: 'auto'
      notificar_sucesso:
        description: 'Enviar notificação no WhatsApp mesmo quando estiver tudo OK?'
        required: false
        type: boolean
        default: true
  schedule:
    # Monitoria periódica a cada 30 minutos (alerta no WhatsApp apenas se houver falha)
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  monitorar_tunnel:
    name: "Validar Ponte Galaxy A70 & Notificar WhatsApp"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Selecionar modo de túnel (Tailscale ou OpenVPN)
        id: mode
        env:
          INPUT_MODE: ${{ inputs.modo_conexao || 'auto' }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
        run: |
          if [[ "$INPUT_MODE" == "tailscale" ]] || [[ "$INPUT_MODE" == "auto" && -n "$TS_AUTHKEY" ]]; then
            echo "selected=tailscale" >> "$GITHUB_OUTPUT"
            echo "target_host=wireguard.luisices.com.br" >> "$GITHUB_OUTPUT"
            echo "Usando túnel Tailscale direto para wireguard.luisices.com.br (100.97.222.39)"
          else
            echo "selected=openvpn" >> "$GITHUB_OUTPUT"
            echo "target_host=192.168.0.252" >> "$GITHUB_OUTPUT"
            echo "Usando túnel OpenVPN para validar a ponte Galaxy A70 (192.168.0.252 / 100.97.222.39)"
          fi

      - name: Conectar ao Tailscale (WireGuard)
        if: steps.mode.outputs.selected == 'tailscale'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Conectar ao OpenVPN residencial
        if: steps.mode.outputs.selected == 'openvpn'
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Validar DNS, Ponte Galaxy A70 (SSH, SOCKS5, FTP Forward) e Túnel WireGuard/Tailscale
        id: check
        env:
          TARGET_HOST: ${{ steps.mode.outputs.target_host }}
          MODE_USED: ${{ steps.mode.outputs.selected }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys
          import time
          from ftplib import FTP

          target_host = os.environ["TARGET_HOST"]
          mode_used = os.environ["MODE_USED"]
          ftp_user = os.environ["FTP_USER"]
          ftp_pass = os.environ["FTP_PASSWORD"]

          results = []
          errors = []

          # 1. Validar DNS Cloudflare (wireguard.luisices.com.br -> 100.97.222.39)
          try:
              dns_ip = socket.gethostbyname("wireguard.luisices.com.br")
              if dns_ip == "100.97.222.39":
                  results.append(f"✅ DNS: wireguard.luisices.com.br -> {dns_ip}")
              else:
                  errors.append(f"⚠️ DNS inesperado: wireguard.luisices.com.br -> {dns_ip}")
          except Exception as e:
              errors.append(f"❌ DNS wireguard.luisices.com.br falhou: {e}")

          # 2. Validar portas da Ponte Galaxy A70 (2222 SSH, 1080 SOCKS5, 2121 FTP Bridge, 5555 ADB Bridge)
          ports = {
              2222: "SSH Termux (A70)",
              1080: "Proxy SOCKS5 (microsocks)",
              2121: "Ponte FTP Roteador (socat)",
              5555: "Ponte ADB Fire TV (socat)",
          }
          for port, desc in ports.items():
              t0 = time.time()
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(8)
              try:
                  s.connect((target_host, port))
                  ms = int((time.time() - t0) * 1000)
                  results.append(f"✅ Porta {port} ({desc}): ONLINE ({ms}ms)")
              except Exception as e:
                  errors.append(f"❌ Porta {port} ({desc}) em {target_host}: OFFLINE ({e})")
              finally:
                  s.close()

          # 3. Validar Login FTP e Listagem de Episódios ATRAVÉS da Ponte Galaxy A70 (porta 2121)
          try:
              ftp = FTP()
              ftp.connect(target_host, 2121, timeout=15)
              ftp.login(ftp_user, ftp_pass)
              ftp.cwd("/G/Series/Longe demais - Segunda Temporada")
              stat_res = ftp.sendcmd("STAT .")
              ftp.quit()
              mp4_count = stat_res.count(".mp4")
              srt_count = stat_res.count(".pt-BR.srt")
              results.append(f"✅ FTP via Ponte A70 ({target_host}:2121): OK ({mp4_count} vídeos .mp4, {srt_count} legendas .pt-BR.srt)")
          except Exception as e:
              errors.append(f"❌ FTP via Ponte A70 ({target_host}:2121) falhou: {e}")

          summary_lines = [f"🛡️ *Monitoria da Ponte Galaxy A70 ({mode_used.upper()})*"]
          summary_lines.extend(results)
          if errors:
              summary_lines.extend(errors)

          report = "\n".join(summary_lines)
          print(report)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("report<<EOF\n" + report + "\nEOF\n")
              fh.write(f"has_errors={'true' if errors else 'false'}\n")

          if errors:
              sys.exit(1)
          PY

      - name: Desconectar OpenVPN
        if: always() && steps.mode.outputs.selected == 'openvpn'
        uses: ./.github/actions/openvpn-disconnect

      - name: Enviar Notificação de Sucesso via WhatsApp
        if: success() && (github.event_name == 'workflow_dispatch' && inputs.notificar_sucesso != false)
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          REPORT_MSG: ${{ steps.check.outputs.report }}
        run: |
          python3 notificar_whatsapp.py "$REPORT_MSG" --status success

      - name: Enviar Alerta de Queda/Falha via WhatsApp
        if: failure()
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          REPORT_MSG: ${{ steps.check.outputs.report || '❌ Falha crítica ao estabelecer túnel com a rede local / Ponte Galaxy A70.' }}
        run: |
          python3 notificar_whatsapp.py "$REPORT_MSG" --status error
