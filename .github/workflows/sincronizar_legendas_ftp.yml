name: Sincronizar Legendas com FTP

run-name: "📤 Sincronizar Legendas Prontas (Ep 31, 32, 33) para o FTP · ${{ inputs.network_mode }}"

on:
  workflow_dispatch:
    inputs:
      ftp_dir:
        description: 'Diretório no FTP'
        required: false
        default: '/G/Series/Longe demais - Segunda Temporada'
      network_mode:
        description: Use OpenVPN (recomendado) ou a conexão direta do runner com a internet
        required: true
        type: choice
        options:
          - vpn
          - direct
        default: vpn

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Conectar à VPN para acessar o FTP
        if: ${{ inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Enviar legendas para o FTP
        env:
          FTP_BASE_DIR: ${{ inputs.ftp_dir }}
          FTP_HOST: ${{ inputs.network_mode == 'vpn' && '192.168.0.1' || secrets.FTP_HOST }}
          FTP_PORT: ${{ inputs.network_mode == 'vpn' && '21' || secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ENCODED_DIR=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["FTP_BASE_DIR"]))')
          
          cd legendas_prontas
          echo "Iniciando upload das legendas normalizadas para o FTP..."
          for f in *; do
            if [ -f "$f" ]; then
              echo "----------------------------------------"
              echo "Enviando $f para $FTP_BASE_DIR..."
              curl -# --fail --ftp-pasv \
                --retry 5 --retry-delay 5 --retry-connrefused \
                -u "$FTP_USER:$FTP_PASSWORD" \
                -T "$f" \
                "ftp://${FTP_HOST}:${FTP_PORT}${ENCODED_DIR}/"
              echo "✓ Concluído: $f"
            fi
          done
          echo "Todos os arquivos foram enviados com sucesso!"

      - name: Desconectar da VPN
        if: ${{ always() && inputs.network_mode == 'vpn' }}
        uses: ./.github/actions/openvpn-disconnect

      - name: Salvar Artifact de Backup no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendas-prontas-ep31-32-33
          path: legendas_prontas/

      - name: Notificar Sincronização via WhatsApp (Evolution API)
        if: ${{ success() }}
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
        run: |
          MSG="📤 *Legendas Prontas Sincronizadas!*\nTodos os arquivos de 'legendas_prontas/' foram enviados para o FTP (${{ inputs.ftp_dir }})."
          python3 notificar_whatsapp.py "$MSG" --status success || true

      - name: Notificar Falha via WhatsApp (Evolution API)
        if: ${{ failure() }}
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'https://wa.luisices.com.br' }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'homeassistant' }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
        run: |
          MSG="⚠️ Falha ao sincronizar legendas prontas com o FTP."
          python3 notificar_whatsapp.py "$MSG" --status error || true

