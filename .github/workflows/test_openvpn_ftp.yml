name: Test OpenVPN FTP connection

on:
  workflow_dispatch:
    inputs:
      season:
        description: Temporada para validar o acesso de leitura ao FTP
        required: true
        type: choice
        options:
          - Segunda Temporada
          - Terceira Temporada
          - Primeira Temporada
        default: Segunda Temporada

permissions:
  contents: read

jobs:
  test-vpn-ftp:
    name: Connect to FTP through OpenVPN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: 192.168.0.1
      FTP_PORT: "21"
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_BASE_DIR: /G/Series/Longe demais - ${{ inputs.season }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in OPENVPN_CONFIG FTP_USER FTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}

      - name: Connect to OpenVPN
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Verify FTP login and directory listing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from ftplib import FTP

          phase = "connect"
          try:
              ftp = FTP()
              ftp.connect(
                  os.environ["FTP_HOST"],
                  int(os.environ["FTP_PORT"]),
                  timeout=20,
              )
              phase = "login"
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])
              phase = "change directory"
              ftp.cwd(os.environ["FTP_BASE_DIR"])
              phase = "list directory"
              entries = ftp.nlst()
              ftp.quit()
          except Exception as error:
              response_code = str(error).split(maxsplit=1)[0]
              if not response_code[:3].isdigit():
                  response_code = type(error).__name__
              print(
                  f"FTP test failed during {phase} (response {response_code}).",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(
              "FTP login and directory listing succeeded "
              f"({len(entries)} entries in the selected season directory)."
          )
          PY

      - name: Stop OpenVPN
        if: always()
        uses: ./.github/actions/openvpn-disconnect
