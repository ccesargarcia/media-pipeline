name: Test OpenVPN FTP connection

on:
  workflow_dispatch:
    inputs:
      season:
        description: Temporada para validar o acesso de leitura ao FTP
        required: true
        type: choice
        options:
          - Segunda Temporada
          - Terceira Temporada
          - Primeira Temporada
        default: Segunda Temporada

permissions:
  contents: read

jobs:
  test-vpn-ftp:
    name: Connect to FTP through OpenVPN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: 192.168.0.1
      FTP_PORT: "21"
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_BASE_DIR: /G/Series/Longe demais - ${{ inputs.season }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in OPENVPN_CONFIG FTP_USER FTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}

      - name: Connect to OpenVPN
        uses: ./.github/actions/openvpn-connect
        with:
          config: ${{ secrets.OPENVPN_CONFIG }}

      - name: Instalar dependências para consulta de disco
        run: pip3 install smbprotocol

      - name: Verify FTP login and directory listing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from ftplib import FTP

          phase = "connect"
          try:
              ftp = FTP()
              ftp.connect(
                  os.environ["FTP_HOST"],
                  int(os.environ["FTP_PORT"]),
                  timeout=20,
              )
              phase = "login"
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])

              print("=== TESTE DE COMANDOS DE DISCO NO FTP ===")
              for cmd in ["AVBL", "AVBL /G", "AVBL /", "SITE DSPACE", "SITE FREE", "STAT /G"]:
                  try:
                      res = ftp.sendcmd(cmd)
                      print(f"Comando FTP '{cmd}' -> Resposta: {res}")
                  except Exception as e:
                      print(f"Comando FTP '{cmd}' -> Não suportado ({e})")

              print("\n=== TESTE DE CONSULTA DE DISCO VIA SAMBA (SMB) ===")
              try:
                  import smbclient
                  for share in ["G", "share", "tp-share", "volume1"]:
                      try:
                          vol = smbclient.stat_volume(
                              f"\\\\{os.environ['FTP_HOST']}\\{share}",
                              username=os.environ["FTP_USER"],
                              password=os.environ["FTP_PASSWORD"],
                          )
                          total_gb = (vol.f_blocks * vol.f_frsize) / (1024**3)
                          free_gb = (vol.f_bavail * vol.f_frsize) / (1024**3)
                          used_gb = total_gb - free_gb
                          print(f"🎉 SUCESSO NO SAMBA! Share '{share}':")
                          print(f"   Espaço Total: {total_gb:.2f} GB")
                          print(f"   Espaço Usado: {used_gb:.2f} GB")
                          print(f"   Espaço Livre: {free_gb:.2f} GB")
                          break
                      except Exception as e:
                          print(f"Samba share '{share}': {e}")
              except Exception as e:
                  print(f"Erro geral no Samba: {e}")

              phase = "change directory"
              try:
                  ftp.cwd(os.environ["FTP_BASE_DIR"])
              except Exception:
                  phase = "create directory"
                  print(f"Diretório {os.environ['FTP_BASE_DIR']} não encontrado. Criando diretório no FTP...")
                  ftp.mkd(os.environ["FTP_BASE_DIR"])
                  ftp.cwd(os.environ["FTP_BASE_DIR"])
                  print(f"Diretório {os.environ['FTP_BASE_DIR']} criado com sucesso!")
              phase = "list directory"
              entries = ftp.nlst()
              ftp.quit()
          except Exception as error:
              response_code = str(error).split(maxsplit=1)[0]
              if not response_code[:3].isdigit():
                  response_code = type(error).__name__
              print(
                  f"FTP test failed during {phase} (response {response_code}).",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("\n".join(sorted(entries)))
          print(
              "FTP login and directory listing succeeded "
              f"({len(entries)} entries in the selected season directory)."
          )
          PY

      - name: Stop OpenVPN
        if: always()
        uses: ./.github/actions/openvpn-disconnect
